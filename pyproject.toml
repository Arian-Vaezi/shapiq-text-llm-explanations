[build-system]
requires = ["setuptools>=69", "wheel", "setuptools_scm>=8", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "shapiq"
dynamic = ["readme", "version"]
description = "Shapley Interactions for Machine Learning"
requires-python = ">=3.12"
dependencies = [
    # core
    "numpy",
    "scipy",
    "pandas",
    "joblib",
    "scikit-learn",
    "tqdm",
    "requests",
    "sparse-transform",  # for sparse approximators (spex, proxyspex)
    "galois",            # for sparse approximators (spex, proxyspex)
    # plotting
    "matplotlib",
    "networkx",
    "colour",
    "pillow",
    "gradio>=6.14.0",
    "transformers>=5.3.0",
    "torch>=2.10.0",
    "accelerate>=1.13.0",
    "sentence-transformers>=5.5.1",
    "google-genai>=2.8.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.58.0",
    "groq>=1.4.0",
]
authors = [
    {name = "Maximilian Muschalik", email = "Maximilian.Muschalik@lmu.de"},
    {name = "Santo M. A. R. Thies", email = "S.Thies@campus.lmu.de"},
    {name = "Hubert Baniecki"},
    {name = "Fabian Fumagalli"},
]
maintainers = [
    {name = "Maximilian Muschalik", email = "Maximilian.Muschalik@lmu.de"},
    {name = "Santo M. A. R. Thies", email = "S.Thies@campus.lmu.de"},
]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    'Operating System :: Microsoft :: Windows',
    'Operating System :: Unix',
    'Operating System :: MacOS',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]
keywords = [
    "python",
    "machine learning",
    "interpretable machine learning",
    "shap",
    "xai",
    "explainable ai",
    "interaction",
    "shapley interactions",
    "shapley values",
    "feature interaction",
]
[tool.coverage.report]
exclude_also = [
    'if TYPE_CHECKING:',
]

[tool.setuptools_scm]
write_to = "src/shapiq/_version.py"

[tool.setuptools.packages.find]
where = ["./src"]
include = ["shapiq*", "lazy_dispatch", "demos*"]

[tool.setuptools.dynamic]
readme = {file = ["README.md", "CHANGELOG.md"], content-type = "text/markdown"}

[project.urls]
documentation = "https://shapiq.readthedocs.io"
source = "https://github.com/mmschlk/shapiq"
tracker = "https://github.com/mmschlk/shapiq/issues"
changelog = "https://github.com/mmschlk/shapiq/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = [
  "tests/shapiq",
  "tests/shapiq_games"
]
pythonpath = ["src"]
minversion = "8.0"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["tests", "src", "docs"]
exclude = ["*.ipynb"]

[tool.ruff.lint]
# we allow star arguments to be of type Any e.g. def func(*args: Any, **kwargs: Any) -> None: is ok
flake8-annotations.allow-star-arg-any = true
select = ["ALL"]
ignore = [
    "E501",  # Line too long
    "N803",  # Variable X in function should be lowercase
    "N806",  # Variable X in function should be lowercase
    "COM812",  # this is redundant with the formatter which anyways does this (must be excluded) in the future # TODO: add remove pickle calls and remove this exclusion
    "FIX002",  # we use TODOs atm to track potential code improvements  # TODO: add this in the future
    "PLR0913",  # Too many arguments are passed to function
    "PLR0915", # Too many statements in function
    "PLR0912",  # Too many branches in function
    "PLR2004",  # Magic values in comparison ... this gets flaged with all checks for two-way interactions
    "C901",  # Too complex functions
    "PLR0911",  # too many return statements in function
    "N802",  # Function name should be lowercase
]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "docs/build",
]

# Exclude a variety of commonly ignored directories.
# Note to developers: If you add a new ignore at least put a comment next to it why it is ignored
[tool.ruff.lint.per-file-ignores]
"src/shapiq/typing.py" = [
    "A005",  # we want to be similar to other libraries that also shadow typing
    "D102",  # we don't need docstrings for protocol stubs
    "ANN401",  # any return type is okay in typing.py for protocol subts
]
"tests/*.py" = [
    # "ALL",
    "S101", # we need asserts in tests
    "D",    # test docstrings don't matter too much
    "E501", # line too long
    "ANN",  # type annotations
    "ARG",  # some functions are not used
    "INP",  # inports can be different
    "N",  # type hints are excludes in tests
    "PTH",  # we can use os for now
    "S",  # in tests we can use some security issues for now
    "PT", # we can use print statements in tests
    "NPY",
    "SLF",  # private members are okay in tests
    "TRY",
]
"examples/**/*.py" = [
    "E402",  # Module level import not at top of file
    "T20",  # examples can have print statements
    "I002",  # examples do not have to import required modules
    "D",  # docstrings are not required in examples
    "SLF001",  # private members are okay in examples
    "ANN001",  # type annotations are not required in examples
    "INP",  # examples are an implicit namespace package
]
"src/demos/SentimentAnalysis/__init__.py" = [
    "N999",  # SentimentAnalysis is a demo folder name, not an importable public package
]
"src/demos/**/*.py" = [
    "T20",   # demos can have print statements
    "D",     # docstrings are not required in demos
    "INP",   # demos can be an implicit namespace package
    "N999",  # demos can have camelCase module/file names
]
"demos/rag_retrieval_explanation/tests/**/*.py" = [
    "S101", # pytest uses assertions
    "D",    # test docstrings are optional
    "E501", # descriptive test data may use long lines
    "ANN",  # fixture annotations are optional
    "ARG",  # fixtures may require unused arguments
    "INP",  # tests are collected as a package
    "N",    # test helper names prioritize readability
    "PTH",  # path style is not part of the production API
    "S",    # security rules are relaxed for test fixtures
    "PT",   # existing pytest style is accepted
    "NPY",
    "SLF",  # tests may inspect private helpers
    "TRY",
]
"demos/rag_retrieval_explanation/backend/services.py" = [
    "PLC0415",  # defer registry imports to avoid eager model setup
]
"demos/rag_retrieval_explanation/core/chunking.py" = [
    "PLC0415",  # PDF parsers are optional dependencies
]
"demos/rag_retrieval_explanation/core/model_backends.py" = [
    "PLC0415",  # llama-cpp-python is an optional dependency
]
"demos/rag_retrieval_explanation/core/retrieval.py" = [
    "PLC0415",  # dense retrieval dependencies are optional
]
"docs/source/*.py" = [
    "A001",  # some conf.py variables shadow builtins which is okay here
    "ANN001",  # some magic functions I don't want to annotate
    "INP",  # docs can be an implicit package (does not need to be imported)
    "I002",  # benchmark code does not have to import required modules
]
"benchmark/*.py" = [
    "INP", # imports can be different here
    "I002",  # benchmark code does not have to import required modules
    "PTH"  # in benchmark code we use a lot of os, which is okay
]
"__init__.py" = [
    "I002", # __init__.py does not have to import required modules
    "RUF022",  # we can have unsorted imports in __init__.py
    "FA",
]
"scripts/*.py" = [
    "INP", # imports can be different here
    "I002",  # script code does not have to import required modules
    "PTH",  # in script code we use a lot of os, which is okay
    "T201",  # scripts can have print statements
    "BLE001",  # scripts can have bare excepts
    "TRY",
    "PLC0415",  # scripts may defer optional heavyweight dependencies
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
# The RAG demo is intentionally not ty-gated: its optional deps (pypdf,
# llama-cpp-python, fastapi, ...) are not installed in the lint CI job, so ty
# cannot resolve them. Demos sit in the same "not type-checked" category as
# tests/benchmark/scripts/shapiq_games below. ruff still lints/formats the demo.
include = ["src/shapiq"]
exclude = [
    "tests",
    "docs",
    "benchmark",
    "scripts",
    "src/shapiq_games",
    "src/shapiq/explainer/",
    "src/shapiq/game.py",
    "src/shapiq/game_theory/",
    "src/shapiq/imputer/",
    "src/shapiq/interaction_values.py",
    "src/shapiq/plot/",
    "src/shapiq/tree/",
]

[tool.ty.environment]
python-version = "3.12"
python = "./.venv"
python-platform = "linux"

[tool.cibuildwheel]
build = ["cp312-*", "cp313-*", "cp314-*"]
skip = ["*-win32", "*-manylinux_i686", "pp*", "*musllinux*"]
build-frontend = "uv"
test-command = "python -c \"import shapiq; from shapiq.tree.conversion import cext; from shapiq.tree.interventional import cext; print('C extensions OK')\""

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
before-build = "brew install libomp || true"

[tool.cibuildwheel.windows]
# MSVC ships OpenMP runtime (vcomp140.dll) with Visual C++ Redistributable
# No extra setup needed; /openmp flag in setup.py handles everything

[tool.ruff.lint.isort]
known-first-party = ["shapiq"]
extra-standard-library = ["typing_extensions"]
combine-as-imports = true
force-wrap-aliases = true
no-lines-before = ["future"]
required-imports = ["from __future__ import annotations"]


[dependency-groups]
rag_demo = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "pypdf",
    "llama-cpp-python>=0.3.16",
]
all_ml = [
    "tabpfn>=2.1.3",
    "torchvision",
    "torch",
    "xgboost",
    "lightgbm",    # lightgbm has install problems on macOS in github actions
    "transformers",
    "scikit-image",
    "tensorflow; python_version < '3.13' and platform_system != 'Windows'", # only up to py 3.12
    "tf-keras; python_version < '3.13' and platform_system != 'Windows'",   # only up to py 3.12
]
test = [
    "pytest>=9.0.2",        # for running tests
    "pytest-cov>=7.0.0",    # for coverage
    "pytest-xdist>=3.8.0",  # for parallel test execution
    "packaging",            # for version parsing in tests
]
lint = [
    "ruff>=0.14.1",       # for linting
    "pre-commit>=4.3.0",  # for running the linters pre-commit hooks
    "ty>=0.0.21",         # for type checking
]
docs = [
    "sphinx>=9.1.0",            # documentation generator
    "furo",                     # beautiful sphinx theme
    "myst-parser",              # Markdown support for Sphinx
    "sphinx-copybutton",        # copy button for code blocks
    "sphinx-autodoc-typehints", # include typehints in docs
    "sphinxcontrib-bibtex",     # references based on bibtex
    "ipython>=9.0.0",           # for code execution in sphinx-gallery
    "sphinx-gallery",           # gallery of examples from Python scripts
    "matplotlib",               # required for sphinx-gallery thumbnails
    {include-group = "all_ml"}
]
dev = [
    "notebook>=7.3.3",
    "ipywidgets",
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "all_ml"},
]

# ---------------------------------------------------------------------------
# GPU support: pull a CUDA build of torch matched to the platform's driver.
# Scoped with sys_platform markers so macOS keeps the default PyPI wheels
# (there are no CUDA wheels for macOS).
#   - Windows dev boxes:  cu126
#   - Linux GPU clusters: cu128. The default PyPI Linux wheel is now built for
#     CUDA 13.0, which is too new for drivers like LRZ HLAI's CUDA 12.9 (torch
#     then reports cuda_available=False and silently runs on CPU). A cu128 build
#     runs on any 12.8+ driver. CI is GPU-less, but CUDA wheels run fine on CPU,
#     so this is safe there too.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
# torchvision's compiled ops (e.g. torchvision::nms) must be built against the exact
# same torch build, or importing it fails with "operator torchvision::nms does not
# exist". transformers imports torchvision eagerly, so a mismatch breaks even text-only
# use. Pin it to the same cu128 index as torch on Linux so uv installs a matched pair.
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
