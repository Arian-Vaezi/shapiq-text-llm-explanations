# Expected behavior for controlled RAG Shapley scenarios.
#
# These are research-demo expectations, not hard factual labels for a public
# benchmark. They define what the explanation should make visible.

cases:
  - id: puzzle_pieces_marie_curie
    trace_name: "Marie Curie Nobel categories"
    scenario_type: "complementary_evidence"
    thesis_point: "Two retrieved chunks are needed to fully support the answer."
    expected_top_evidence:
      - "1903 Nobel Prize in Physics"
      - "1911 Nobel Prize in Chemistry"
    expected_low_evidence:
      - "Curie family background"
      - "Nobel Peace Prize note"
    expected_interactions:
      positive:
        - ["1903 Nobel Prize in Physics", "1911 Nobel Prize in Chemistry"]
    validation_expectations:
      full_context_support: "high"
      deletion: "removing either puzzle-piece chunk should reduce support"
      insertion: "adding both puzzle-piece chunks should recover support"

  - id: signal_vs_distractors_olympics
    trace_name: "2008 Beijing Olympics host city"
    scenario_type: "direct_evidence_with_distractors"
    thesis_point: "Answer support can differ from keyword-style retrieval relevance."
    expected_top_evidence:
      - "2008 Summer Olympics"
    expected_low_evidence:
      - "London 2012"
      - "Olympic host bidding"
    validation_expectations:
      full_context_support: "high"
      deletion: "removing the direct answer chunk should cause the largest drop"
      insertion: "the direct answer chunk should quickly recover support"

  - id: missing_evidence_eiffel
    trace_name: "Unsupported Eiffel Tower answer"
    scenario_type: "missing_evidence"
    thesis_point: "The explanation should not invent strong support when retrieval missed the answer."
    expected_top_evidence: []
    expected_low_evidence:
      - "Paris tourism"
      - "World fairs"
      - "Seine river"
      - "French architecture"
    validation_expectations:
      full_context_support: "low"
      deletion: "no single removal should look like removing decisive evidence"
      insertion: "no small subset should recover strong support"

  - id: conflicting_context_australia
    trace_name: "Australia capital confusion"
    scenario_type: "conflicting_context"
    thesis_point: "Correct evidence should separate from plausible wrong associations."
    expected_top_evidence:
      - "Capital fact"
    expected_low_evidence:
      - "Sydney distractor"
      - "Melbourne context"
    validation_expectations:
      full_context_support: "high"
      deletion: "removing Capital fact should cause the largest drop"
      insertion: "Capital fact should recover support faster than distractors"

  - id: redundancy_atlantic
    trace_name: "Atlantic Ocean redundancy"
    scenario_type: "redundant_evidence"
    thesis_point: "Near-duplicate evidence should split credit and show redundancy."
    expected_top_evidence:
      - "Atlantic Ocean — eastern border"
      - "South America — ocean borders"
    expected_low_evidence:
      - "Pacific Ocean — western border"
      - "South American geography"
    expected_interactions:
      negative:
        - ["Atlantic Ocean — eastern border", "South America — ocean borders"]
    validation_expectations:
      full_context_support: "high"
      deletion: "removing one duplicate should hurt less than removing unique decisive evidence"
      insertion: "either duplicate should provide much of the support"
