# embedding_compare.yaml — compare TF-IDF vs two dense embedding models.
# Answers: does switching from sparse to dense retrieval change which
# chunks are selected, and does that shift Shapley attribution rankings?

name: embedding_compare
description: >
  Three retrieval methods: TF-IDF, MiniLM dense, BGE-small dense.
  Fixed chunk size 180/35 and lexical grounding value function.
  Run with: make compare-embeddings PDF_CASES=...
  Note: dense configs require torch + transformers (downloads models).

chunking:
  - chunk_words: 180
    overlap: 35

retrieval:
  - method: tfidf
  - method: dense
    embedding_model: sentence-transformers/all-MiniLM-L6-v2
  - method: dense
    embedding_model: BAAI/bge-small-en-v1.5

generation:
  - backend: extractive

value_functions:
  - lexical_grounding

shapley:
  approximator: kernel_shap
  budget: 256
  random_seed: 42
  max_order: 2

output:
  top_k: 4
  save_artifacts: true
  save_plots: true
